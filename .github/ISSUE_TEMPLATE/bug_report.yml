name: 问题报告
description: 报告可复现的页面、地图或数据展示问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请勿在公开 Issue 中提交密钥、个人信息或未公开的安全漏洞。"
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: "例如 macOS 15 · Safari 18"
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息

name: 功能建议
description: 提出与徒步路线发现、行前决策或无障碍体验相关的建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 数据、安全或合规影响
      description: "若涉及路线、位置或户外风险，请说明信息来源与潜在影响。"

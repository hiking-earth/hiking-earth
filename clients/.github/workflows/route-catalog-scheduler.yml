name: Schedule public hiking catalog refresh
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-catalog-scheduler
  cancel-in-progress: false
jobs:
  refresh:
    uses: ./.github/workflows/route-catalog-update.yml
    with:
      publish: true
    permissions:
      contents: write
    secrets:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      ROUTE_AUDIT_WORKER_TOKEN: ${{ secrets.ROUTE_AUDIT_WORKER_TOKEN }}
      DURUNUBI_SERVICE_KEY: ${{ secrets.DURUNUBI_SERVICE_KEY }}

name: Refresh bounded Europe OSM extracts
on:
  schedule:
    - cron: '43 4 15 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-osm-pbf-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.HIKING_PBF_REFRESH_READY == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned PBF reader
        run: python -m pip install -r scripts/requirements-pbf.txt
      - name: Refresh bounded European country extracts
        id: refresh
        continue-on-error: true
        run: python scripts/refresh-europe-osm-pbf.py --batch-size 12
      - name: Prepare atomic OSM catalog snapshots
        id: prepare_catalog
        if: always() && steps.refresh.outcome != 'skipped'
        run: python scripts/prepare-catalog-pages.py --source osm
      - name: Record bounded source refresh
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          echo "Regional OSM refresh step: $REFRESH_OUTCOME. Data remains pending verification; no opening status or navigation permission is inferred." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit successful source updates and evidence
        if: always() && steps.prepare_catalog.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data/catalog/osm.json docs/release/osm-europe-pbf-refresh-*.json shared/public-catalog/osm app/cloudfunctions/catalog-feed/snapshots/osm app/cloudfunctions/client-api/business/catalog-feed/snapshots/osm
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh bounded European OSM route extracts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

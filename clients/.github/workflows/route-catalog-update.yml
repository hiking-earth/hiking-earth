      - name: Require a complete route review queue before catalog publication
        id: complete_access_queue
        if: ${{ !cancelled() && steps.access_audit.outcome == 'success' }}
        env:
          REPORT_PATH: ${{ runner.temp }}/route-access-review.json
          CHUNKS_DIR: ${{ runner.temp }}/route-access-review-chunks
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          MAX_REVIEW_MANIFEST_BYTES = 1024 * 1024
          MAX_REVIEW_CHUNK_BYTES = 1024 * 1024

          def read_bounded_regular_file(path, limit, label):
              path = Path(path)
              if path.is_symlink() or not path.is_file():
                  raise ValueError(f'{label} is not a regular file')
              with path.open('rb') as stream:
                  payload = stream.read(limit + 1)
              if len(payload) > limit:
                  raise ValueError(f'{label} exceeds the {limit}-byte budget')
              return payload

          manifest_payload = read_bounded_regular_file(
              os.environ['REPORT_PATH'], MAX_REVIEW_MANIFEST_BYTES, 'route review manifest')
          manifest = json.loads(manifest_payload.decode('utf-8'))
          chunks = manifest.get('chunks')
          sources = manifest.get('sources')
          listed = 0
          total_bytes = 0
          complete = (manifest.get('schemaVersion') == 2
                      and isinstance(sources, dict) and 0 < len(sources) <= 64
                      and isinstance(chunks, list)
                      and len(chunks) <= 200
                      and manifest.get('reviewCandidatesTruncated') is False
                      and isinstance(manifest.get('listedCount'), int)
                      and not isinstance(manifest.get('listedCount'), bool)
                      and 0 <= manifest['listedCount'] <= 20000
                      and isinstance(manifest.get('reviewCandidateCount'), int)
                      and not isinstance(manifest.get('reviewCandidateCount'), bool)
                      and manifest['reviewCandidateCount'] >= 0
                      and isinstance(manifest.get('candidateBytes'), int)
                      and not isinstance(manifest.get('candidateBytes'), bool)
                      and 0 <= manifest['candidateBytes'] <= 48 * 1024 * 1024
                      and manifest.get('reviewCandidateCount') == manifest.get('listedCount'))
          if complete:
              for source in sources.values():
                  if (not isinstance(source, dict) or not isinstance(source.get('routeCount'), int)
                          or isinstance(source.get('routeCount'), bool) or source['routeCount'] < 0
                          or not isinstance(source.get('negativeSignalCount'), int)
                          or isinstance(source.get('negativeSignalCount'), bool) or source['negativeSignalCount'] < 0
                          or source['negativeSignalCount'] > source['routeCount']
                          or ('sourceChangeCount' in source and (not isinstance(source.get('sourceChangeCount'), int)
                              or isinstance(source.get('sourceChangeCount'), bool) or source['sourceChangeCount'] < 0
                              or source['sourceChangeCount'] > source['routeCount']))):
                      complete = False
                      break
              complete = complete and sum(source['negativeSignalCount'] + source.get('sourceChangeCount', 0)
                                          for source in sources.values()) == manifest['reviewCandidateCount']
          if complete:
              for index, descriptor in enumerate(chunks):
                  path = Path(os.environ['CHUNKS_DIR']) / f'page-{index:03d}.json'
                  if (not isinstance(descriptor, dict) or descriptor.get('index') != index
                          or not isinstance(descriptor.get('count'), int)
                          or isinstance(descriptor.get('count'), bool) or not 1 <= descriptor['count'] <= 100
                          or not isinstance(descriptor.get('bytes'), int)
                          or isinstance(descriptor.get('bytes'), bool) or not 2 <= descriptor['bytes'] <= MAX_REVIEW_CHUNK_BYTES
                          or total_bytes + descriptor['bytes'] > manifest['candidateBytes']
                          or path.is_symlink() or not path.is_file()):
                      complete = False
                      break
                  try:
                      payload = read_bounded_regular_file(
                          path, MAX_REVIEW_CHUNK_BYTES, f'route review chunk {index}')
                      items = json.loads(payload.decode('utf-8'))
                  except (OSError, UnicodeDecodeError, ValueError, json.JSONDecodeError):
                      complete = False
                      break
                  if (len(payload) != descriptor.get('bytes')
                          or hashlib.sha256(payload).hexdigest() != descriptor.get('sha256')
                          or not isinstance(items, list) or len(items) != descriptor.get('count')):
                      complete = False
                      break
                  listed += len(items)
                  total_bytes += len(payload)
              complete = (complete and listed == manifest['listedCount']
                          and total_bytes == manifest.get('candidateBytes'))
          if complete:
              core = {key: value for key, value in manifest.items() if key != 'snapshot'}
              canonical = json.dumps(core, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              complete = hashlib.sha256(canonical).hexdigest() == manifest.get('snapshot')
          if not complete:
              Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8').write(
                  '路线审核分片缺失、超容量或完整性校验失败；保留审核附件并阻止发布新目录。\n')
              print('Incomplete or corrupt route review shard manifest; catalog publication is blocked.', file=sys.stderr)
              raise SystemExit(1)
          Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8').write(
              f"路线审核队列完整：{listed}条候选，{len(chunks)}个分片已校验。\n")
          PY
      - name: Report catalog publication blocked by route access audit failure
        if: ${{ !cancelled() && steps.access_audit.outcome != 'success' }}
        run: echo 'Catalog publication skipped because the route access audit did not complete successfully. Existing published catalog remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report catalog publication blocked by route review queue persistence failure
        if: ${{ !cancelled() && steps.access_audit.outcome == 'success' && (steps.preserve_access_queue.outcome != 'success' || steps.publish_access_queue.outcome != 'success') }}
        run: echo 'Catalog publication skipped because the route review queue could not be preserved or its configured cloud delivery was not accepted. Existing published catalog remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report catalog publication blocked by incomplete route review queue
        if: ${{ !cancelled() && steps.access_audit.outcome == 'success' && steps.complete_access_queue.outcome != 'success' }}
        run: echo 'Catalog publication skipped because some route risk candidates are missing from the bounded human-review queue. Existing published catalog remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail run when route review queue persistence fails
        if: ${{ !cancelled() && steps.access_audit.outcome == 'success' && (steps.preserve_access_queue.outcome != 'success' || steps.publish_access_queue.outcome != 'success') }}
        run: exit 1
      - name: Prepare immutable compressed catalog pages
        id: prepare_catalog
        if: ${{ !cancelled() && steps.access_audit.outcome == 'success' && steps.complete_access_queue.outcome == 'success' && steps.preserve_access_queue.outcome == 'success' && steps.publish_access_queue.outcome == 'success' && steps.outcomes.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
        run: |
          if [ "$CONTENT_OUTCOME" = "success" ]; then
            if python scripts/prepare-catalog-pages.py; then
              news_publishable=true
              echo "news_publishable=true" >> "$GITHUB_OUTPUT"
              echo "catalog_prepared=true" >> "$GITHUB_OUTPUT"
            else
              echo 'Official notice collection completed, but its catalog failed publication validation; retrying with route catalogs only and preserving the current production notice snapshot.' >> "$GITHUB_STEP_SUMMARY"
              python scripts/prepare-catalog-pages.py --exclude-source news
              news_publishable=false
              echo "news_publishable=false" >> "$GITHUB_OUTPUT"
              echo "catalog_prepared=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'Official notice collection failed; prepare validated route catalogs while retaining the existing production notice snapshot.' >> "$GITHUB_STEP_SUMMARY"
            python scripts/prepare-catalog-pages.py --exclude-source news
            news_publishable=false
            echo "news_publishable=false" >> "$GITHUB_OUTPUT"
            echo "catalog_prepared=true" >> "$GITHUB_OUTPUT"
          fi
          NEWS_PUBLISHABLE="$news_publishable" CONTENT_OUTCOME="$CONTENT_OUTCOME" python - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from catalog_collection_status import news_publication_status
          status_path = Path('shared/public-catalog/collection-status.json')
          MAX_COLLECTION_STATUS_BYTES = 4 * 1024 * 1024
          if status_path.is_symlink() or not status_path.is_file():
              raise ValueError('collection status is not a regular file')
          with status_path.open('rb') as stream:
              status_payload = stream.read(MAX_COLLECTION_STATUS_BYTES + 1)
          if len(status_payload) > MAX_COLLECTION_STATUS_BYTES:
              raise ValueError('collection status exceeds its byte budget')
          status = json.loads(status_payload.decode('utf-8'))
          status['newsPublication'] = news_publication_status(
              os.environ.get('NEWS_PUBLISHABLE') == 'true',
              os.environ.get('CONTENT_OUTCOME', 'unknown'),
          )
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish changed snapshot
        id: publish
        if: ${{ !cancelled() && env.CATALOG_PUBLICATION_ALLOWED == 'true' && steps.access_audit.outcome == 'success' && steps.complete_access_queue.outcome == 'success' && steps.preserve_access_queue.outcome == 'success' && steps.publish_access_queue.outcome == 'success' && steps.outcomes.outcome == 'success' && steps.prepare_catalog.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          git add shared/data/catalog/ shared/data/content/ shared/data/offline/ shared/public-catalog/ app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/ 'docs/release/osm-*-pbf-refresh-*.json'
          if git diff --cached --quiet -- shared/data/catalog/ shared/data/content/ shared/data/offline/ shared/public-catalog/ app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/; then
            echo "catalog_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet -- app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/; then
            echo "cloudbase_snapshots_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cloudbase_snapshots_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hiking-earth-catalog[bot]'
          git config user.email 'catalog@users.noreply.github.com'
          git commit -m 'data: refresh sourced hiking discovery catalogs'
          # Preserve source/doc commits added while the collectors were running.
          # A concurrent data conflict stops publication rather than overwriting it.
          case "${GITHUB_REF:?}" in
            refs/heads/*) target_branch="${GITHUB_REF#refs/heads/}" ;;
            *) echo "Catalog refresh requires a branch ref; refusing to push from $GITHUB_REF" >&2; exit 1 ;;
          esac
          git check-ref-format "refs/heads/$target_branch"
          git pull --rebase origin "$target_branch"
          expected_commit=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$target_branch"
          remote_commit=$(git ls-remote origin "refs/heads/$target_branch" | cut -f1)
          test "$remote_commit" = "$expected_commit" || { echo "Catalog branch readback mismatch: expected $expected_commit, received $remote_commit" >&2; exit 1; }
          echo "Verified catalog source commit on origin: $remote_commit"
      - name: Publish validated pages to production read branch
        id: publish_public_catalog
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        timeout-minutes: 10
        env:
          NEWS_PUBLISHABLE: ${{ steps.prepare_catalog.outputs.news_publishable }}
        run: |
          if [ "$NEWS_PUBLISHABLE" = "true" ]; then
            python scripts/publish-public-catalog.py
          else
            python scripts/publish-public-catalog.py --exclude-source news
          fi
      - name: Set up Node.js for CloudBase CLI
        if: ${{ !cancelled() && steps.prepare_catalog.outputs.catalog_prepared == 'true' && steps.publish.outcome == 'success' && steps.publish_public_catalog.outcome == 'success' && steps.publish.outputs.cloudbase_snapshots_changed == 'true' && vars.HIKING_CATALOG_AUTODEPLOY == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Deploy changed catalog snapshots to CloudBase
        if: ${{ !cancelled() && steps.prepare_catalog.outputs.catalog_prepared == 'true' && steps.publish.outcome == 'success' && steps.publish_public_catalog.outcome == 'success' && steps.publish.outputs.cloudbase_snapshots_changed == 'true' && vars.HIKING_CATALOG_AUTODEPLOY == 'true' }}
        timeout-minutes: 40
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
        run: |
          set -euo pipefail
          test -n "$TENCENT_SECRET_ID"
          test -n "$TENCENT_SECRET_KEY"
          test -n "$CLOUDBASE_ENV_ID"
          node --version
          npm install --global @cloudbase/cli@2.6.16
          CLI_PATH="$(command -v tcb)"
          node "$CLI_PATH" login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY"
          BACKUP_DIR="$RUNNER_TEMP/hiking-catalog-cloudbase-$GITHUB_RUN_ID"
          python3 scripts/deploy-client-functions.py \
            --cloudbase-cli "$CLI_PATH" \
            --node "$(command -v node)" \
            --env "$CLOUDBASE_ENV_ID" \
            --backup-dir "$BACKUP_DIR" \
            --functions catalog-feed client-api
      - name: Report CloudBase deployment skipped because auto-deploy is disabled
        if: ${{ !cancelled() && steps.prepare_catalog.outputs.catalog_prepared == 'true' && steps.publish.outcome == 'success' && steps.publish_public_catalog.outcome == 'success' && steps.publish.outputs.cloudbase_snapshots_changed == 'true' && vars.HIKING_CATALOG_AUTODEPLOY != 'true' }}
        run: echo 'Catalog snapshots were committed and the public read branch was updated, but changed CloudBase function snapshots were not deployed because HIKING_CATALOG_AUTODEPLOY is not explicitly true. Cloud clients may continue serving the previous deployed snapshot until an authorized deployment is performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report CloudBase deployment skipped because public catalog publication failed
        if: ${{ !cancelled() && steps.prepare_catalog.outputs.catalog_prepared == 'true' && steps.publish.outcome == 'success' && steps.publish_public_catalog.outcome != 'success' && steps.publish.outputs.cloudbase_snapshots_changed == 'true' }}
        run: echo 'Source snapshots were committed, but publication to the public read branch did not succeed. CloudBase deployment was skipped to prevent client platforms from serving different catalog generations. Existing public and CloudBase snapshots remain the recovery point.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete collection sources
        if: ${{ !cancelled() && steps.outcomes.outcome == 'success' }}
        timeout-minutes: 1
        env:
          PREPARE_CATALOG_OUTCOME: ${{ steps.prepare_catalog.outcome }}
          SOURCE_SNAPSHOT_COMMIT_OUTCOME: ${{ steps.publish.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publish_public_catalog.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from catalog_sources import PUBLIC_CATALOG_FILES, PUBLIC_CATALOG_LABELS
          status_path = Path('shared/public-catalog/collection-status.json')
          MAX_COLLECTION_STATUS_BYTES = 4 * 1024 * 1024
          if status_path.is_symlink() or not status_path.is_file():
              raise ValueError('collection status is not a regular file')
          with status_path.open('rb') as stream:
              status_payload = stream.read(MAX_COLLECTION_STATUS_BYTES + 1)
          if len(status_payload) > MAX_COLLECTION_STATUS_BYTES:
              raise ValueError('collection status exceeds its byte budget')
          status = json.loads(status_payload.decode('utf-8'))
          outcomes = status.get('outcomes', {})
          sources = {source: 'osm_incremental' if source == 'osm' else source
                     for source in PUBLIC_CATALOG_FILES}
          incomplete = {source: outcomes.get(outcome, 'unknown') for source, outcome in sources.items()
                        if outcomes.get(outcome) != 'success'}
          news_publication = status.get('newsPublication')
          if not isinstance(news_publication, dict) or news_publication.get('state') != 'candidate-validated':
              state = news_publication.get('state', 'missing') if isinstance(news_publication, dict) else 'missing'
              reason = news_publication.get('reason') if isinstance(news_publication, dict) else None
              incomplete['official-notice-publication'] = f'{state}' + (f' ({reason})' if reason else '')
          prepare = os.environ.get('PREPARE_CATALOG_OUTCOME', 'unknown')
          source_commit = os.environ.get('SOURCE_SNAPSHOT_COMMIT_OUTCOME', 'unknown')
          publication = os.environ.get('PUBLICATION_OUTCOME', 'unknown')
          if prepare != 'success':
              incomplete['catalog-preparation'] = prepare
          publication_requested = os.environ.get('CATALOG_PUBLICATION_ALLOWED') == 'true'
          if not publication_requested:
              print('Collection-only run: no source commit, production read-branch update, cloud review delivery or CloudBase deployment was requested.')
          if publication_requested and source_commit != 'success':
              incomplete['source-snapshot-commit'] = source_commit
          if publication_requested and publication != 'success':
              incomplete['production-publication'] = publication
          if incomplete:
              print('Some sources failed or only partially refreshed:')
              for source, result in incomplete.items():
                  print(f'- {PUBLIC_CATALOG_LABELS.get(source, source)}: {result}')
              if prepare != 'success':
                  print(f'Production publication was not attempted because catalog preparation did not succeed (prepare={prepare}, source commit={source_commit}, production publish={publication}). Existing production snapshots remain unchanged.')
              elif publication == 'success':
                  print(f'The production read-branch publication step completed (source commit={source_commit}); sources that failed collection retained their previous validated snapshots.')
              elif publication == 'skipped':
                  print(f'Production publication was skipped (source commit={source_commit}); existing production snapshots remain unchanged.')
              else:
                  print(f'Production publication did not complete (prepare={prepare}, source commit={source_commit}, production publish={publication}); inspect commit and remote readback logs before deciding whether production changed.')
              raise SystemExit(1)
          print('All configured source collectors completed successfully.')
          PY
